apiVersion: v1
kind: Secret
metadata:
  name: playwright-runner
type: Opaque
stringData:
  SQS_ACCESS_KEY: {{ .Values.sqs.accessKey | quote }}
  SQS_SECRET_KEY: {{ .Values.sqs.secretKey | quote }}
  REPORT_ACCESS_KEY: {{ .Values.report.accessKey | quote }}
  REPORT_SECRET_KEY: {{ .Values.report.secretKey | quote }}
  RUN_SECRET: {{ .Values.runSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.registry (dict "username" "nologin" "password" .Values.pullSecret "auth" (printf "nologin:%s" .Values.pullSecret | b64enc))) | toJson | b64enc }}
